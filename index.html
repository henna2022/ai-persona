<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 페르소나</title>
<style>
  @font-face { font-family: Paperlogy; font-weight: 400; font-display: swap; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2) format('woff2'); }
  @font-face { font-family: Paperlogy; font-weight: 600; font-display: swap; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2) format('woff2'); }
  @font-face { font-family: Paperlogy; font-weight: 700; font-display: swap; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2) format('woff2'); }
  :root { --text: #191f28; --sub: #4e5968; --muted: #8b95a1; --surface: #f2f4f6; --blue: #3182f6; --blue-press: #1b64da; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #fff; color: var(--text); font-family: Paperlogy, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding-top: env(safe-area-inset-top, 0); }
  .screen.on { display: flex; }
  button { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 16px; padding: 17px 20px; cursor: pointer; touch-action: manipulation; transition: transform .08s, background .12s; }
  button:active { transform: scale(.98); }
  .primary { background: var(--blue); color: #fff; }
  .primary:active { background: var(--blue-press); }
  .secondary { background: var(--surface); color: var(--text); }
  button:disabled { background: var(--surface); color: var(--muted); }
  .bar { display: flex; gap: 10px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0)); background: #fff; }
  .bar button { flex: 1; }

  /* 시작 */
  #start { padding-left: 24px; padding-right: 24px; }
  #start .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  #wordmark { width: min(70vw, 340px); margin-bottom: 10px; }
  #start h1 { font-size: 30px; font-weight: 700; }
  #start h2 { font-size: 26px; font-weight: 700; line-height: 1.35; }
  #start p { font-size: 16px; line-height: 1.6; color: var(--sub); }
  #start small { display: block; font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center; margin-bottom: 4px; }
  #start .bar { padding-left: 0; padding-right: 0; }

  /* 카메라 */
  #cam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .stage { position: relative; display: flex; width: min(100% - 32px, 100vh - 200px); aspect-ratio: 1; margin: auto; border-radius: 24px; overflow: hidden; background: #000; }
  #view { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
  #hint { position: absolute; top: 0; left: 0; right: 0; padding: 18px; text-align: center; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); font-size: 16px; font-weight: 600; pointer-events: none; }
  #hint.big { font-size: 120px; top: 35%; }

  /* 생성 중 */
  #gen { align-items: center; justify-content: center; gap: 22px; font-size: 20px; font-weight: 700; text-align: center; padding: 24px; }
  .spin { width: 44px; height: 44px; border: 4px solid var(--surface); border-top-color: var(--blue); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { to { content: '...'; } }

  /* 결과 */
  .card { display: flex; width: min(100% - 32px, 100vh - 240px); aspect-ratio: 1; margin: auto; padding: 12px; border-radius: 24px; background: var(--surface); }
  #pic { flex: 1; min-height: 0; width: 100%; object-fit: contain; border-radius: 16px; }
  .note { padding: 12px 24px 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); }
</style>
</head>
<body>
<section id="start" class="screen on">
  <div class="body">
    <img id="wordmark" src="title.png" alt="AI 페르소나" onerror="this.replaceWith(Object.assign(document.createElement('h1'), { textContent: 'AI 페르소나' }))">
    <h2>내 얼굴로 만드는<br>나만의 페르소나</h2>
    <p>카메라가 얼굴을 찾아서 눈, 코, 입을<br>도형으로 바꿔 그려요.<br>표정에 따라 머리 위 표시가 달라져요.</p>
  </div>
  <small>카메라 영상은 이 기기 안에서만 처리되고<br>어디에도 전송되거나 저장되지 않아요.</small>
  <div class="bar"><button id="go" class="primary" disabled>불러오는 중…</button></div>
</section>

<section id="live" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div class="stage">
    <canvas id="view"></canvas>
    <div id="hint"></div>
  </div>
  <div class="bar">
    <button id="shuffle" class="secondary">얼굴 고르기</button>
    <button id="shoot" class="primary">촬영하기</button>
  </div>
</section>

<section id="gen" class="screen">
  <div class="spin"></div>
  <p>AI가 페르소나를 생성하고 있어요<span class="dots"></span></p>
</section>

<section id="result" class="screen">
  <div class="card"><img id="pic" alt="완성된 얼굴 그림"></div>
  <p class="note">얼굴 사진은 저장되지 않아요. 이 그림은 기기 안에서만 만들어졌고, 다시 하기를 누르면 바로 지워져요.</p>
  <div class="bar">
    <button id="again" class="secondary">다시 하기</button>
    <button id="save" class="primary">사진 저장</button>
  </div>
</section>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";
const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

// 표정 판정 기준값(0~1). 잘 안 잡히면 이 숫자만 조절. 주소 뒤에 ?debug 를 붙이면 현재 값이 화면에 보임.
const T = { angry: 0.35, smile: 0.4, jawOpen: 0.4, browUp: 0.25 };

const FACES  = ['square', 'circle', 'oval', 'triangle', 'blob'];
const EYES   = ['dot', 'rings', 'square', 'triangle', 'x', 'hatch'];
const BROWS  = ['line', 'zigzag', 'bar', 'ticks', 'scribble', 'lines3', 'none'];
const NOSES  = ['line', 'bar', 'triangle', 'lines3'];
const MOUTHS = ['slot', 'ring', 'lips', 'zigzag', 'x', 'dots'];
// 입술 바깥/안쪽 윤곽 점 (입 모양 그대로 따라 그리는 데 사용)
const LIP_OUT = [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
const LIP_IN  = [78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const debug = params.has('debug');
const imgSrc = params.get('img');           // ?img=사진경로 → 카메라 대신 사진으로 테스트
const video = $('cam'), canvas = $('view'), ctx = canvas.getContext('2d');
const logo = new Image(); logo.src = 'logo.png';
const title = new Image(); title.src = 'title.png';   // 완성본 상단 타이포 (없으면 생략)

let landmarker, source, W, H, look, lm = null, running = false;
const bs = {};                               // 부드럽게 만든 표정 수치

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const P = i => ({ x: lm[i].x * W, y: lm[i].y * H });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

function newLook() {
  look = {
    face: pick(FACES), eyeL: pick(EYES), eyeR: pick(EYES), browL: pick(BROWS), browR: pick(BROWS),
    nose: pick(NOSES), mouth: pick(MOUTHS), neutral: pick(['heart', 'crown']),
    jit: Array.from({ length: 48 }, () => rnd(0.88, 1.12)),
  };
}

// ---- 그리기 기본 ----
function poly(c, pts, close) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); if (close) c.closePath(); c.stroke(); }
function line(c, a, b) { poly(c, [a, b]); }
function circle(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); fill ? c.fill() : c.stroke(); }
function ellipse(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.stroke(); }
function rect(c, x, y, w, h) { c.strokeRect(x, y, w, h); }

function geom() {
  const pts = OVAL.map(P), xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0, top: P(10) };
}

function drawFace(c, { cx, cy, w, h }) {
  switch (look.face) {
    case 'square':   rect(c, cx - w * 0.5, cy - h * 0.5, w, h); break;
    case 'circle':   ellipse(c, cx, cy, w * 0.54, h * 0.54); break;
    case 'oval':     ellipse(c, cx, cy, w * 0.46, h * 0.58); break;
    case 'triangle': poly(c, [{ x: cx - w * 0.62, y: cy - h * 0.45 }, { x: cx + w * 0.62, y: cy - h * 0.45 }, { x: cx, y: cy + h * 0.7 }], true); break;
    case 'blob': {
      const n = look.jit.length;
      poly(c, look.jit.map((j, i) => { const a = i / n * Math.PI * 2; return { x: cx + Math.cos(a) * w * 0.53 * j, y: cy + Math.sin(a) * h * 0.53 * j }; }), true);
    }
  }
}

function drawEye(c, type, { x, y }, r) {
  switch (type) {
    case 'dot':      circle(c, x, y, r); circle(c, x, y, r * 0.25, true); break;
    case 'rings':    for (let k = 1; k <= 3; k++) circle(c, x, y, r * k / 3); circle(c, x, y, r * 0.12, true); break;
    case 'square':   rect(c, x - r, y - r, r * 2, r * 2); circle(c, x, y, r * 0.22, true); break;
    case 'triangle': poly(c, [{ x: x - r, y: y - r * 0.8 }, { x: x + r, y: y - r * 0.8 }, { x, y: y + r }], true); circle(c, x, y, r * 0.2, true); break;
    case 'x':        line(c, { x: x - r, y: y - r }, { x: x + r, y: y + r }); line(c, { x: x - r, y: y + r }, { x: x + r, y: y - r }); line(c, { x: x - r * 0.9, y: y - r * 0.5 }, { x: x + r * 1.1, y: y + r * 0.8 }); break;
    case 'hatch':    for (let k = -1; k <= 1; k++) line(c, { x: x + k * r * 0.6, y: y - r }, { x: x + k * r * 0.6, y: y + r }); break;
  }
}

function drawBrow(c, type, ids, lift) {
  if (type === 'none') return;
  const pts = ids.map(P).map(p => ({ x: p.x, y: p.y - lift }));
  const n = 14, out = [], segs = pts.slice(1).map((p, i) => dist(pts[i], p)), total = segs.reduce((a, b) => a + b, 0);
  for (let k = 0; k < n; k++) {                       // 눈썹 선 위에 점 n개 고르게 찍기
    let d = total * k / (n - 1), i = 0;
    while (i < segs.length - 1 && d > segs[i]) d -= segs[i++];
    const t = segs[i] ? d / segs[i] : 0;
    out.push({ x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t });
  }
  const amp = lift * 0.6;
  switch (type) {
    case 'line':     line(c, pts[0], pts[pts.length - 1]); break;
    case 'zigzag':   poly(c, out.map((p, k) => ({ x: p.x, y: p.y + (k % 2 ? amp : -amp) }))); break;
    case 'bar':      { const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y = pts.reduce((a, p) => a + p.y, 0) / pts.length; rect(c, x0, y - amp, x1 - x0, amp * 2); break; }
    case 'lines3':   { const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y = pts.reduce((a, p) => a + p.y, 0) / pts.length; [-1, 0, 1].forEach(k => line(c, { x: x0, y: y + k * amp * 1.2 }, { x: x1, y: y + k * amp * 1.2 })); break; }
    case 'ticks':    out.forEach(p => line(c, { x: p.x, y: p.y - amp }, { x: p.x, y: p.y + amp })); break;
    case 'scribble': poly(c, out.map((p, k) => ({ x: p.x + (k % 3 - 1) * amp, y: p.y + (k % 2 ? amp * 1.8 : -amp * 1.8) }))); break;
  }
}

function drawNose(c, g) {
  const top = P(6), tip = P(2), nl = P(327), nr = P(98), nw = dist(nl, nr);
  switch (look.nose) {
    case 'line':     line(c, top, tip); break;
    case 'bar':      rect(c, tip.x - nw * 0.14, top.y, nw * 0.28, tip.y - top.y); break;
    case 'triangle': poly(c, [top, { x: tip.x - nw * 0.6, y: tip.y }, { x: tip.x + nw * 0.6, y: tip.y }], true); break;
    case 'lines3':   line(c, top, tip); [-1, 1].forEach(s => line(c, { x: top.x + s * nw * 0.22, y: top.y + (tip.y - top.y) * 0.35 }, { x: tip.x + s * nw * 0.22, y: tip.y })); break;
  }
  const r = g.w * 0.014;                              // 콧구멍은 항상 점 2개
  circle(c, nl.x, nl.y, r); circle(c, nr.x, nr.y, r);
}

function lip(ids, k, ctr) { return ids.map(P).map(p => ({ x: ctr.x + (p.x - ctr.x) * k, y: ctr.y + (p.y - ctr.y) * k })); }
function loop(c, pts) {                               // 점들을 부드러운 닫힌 곡선으로
  const n = pts.length, m0 = mid(pts[n - 1], pts[0]); c.beginPath(); c.moveTo(m0.x, m0.y);
  for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); c.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y); }
  c.closePath(); c.stroke();
}
function bbox(pts) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}
function drawMouth(c, g) {
  const ctr = mid(P(13), P(14)), out = lip(LIP_OUT, 1.2, ctr), inn = lip(LIP_IN, 1.2, ctr);
  const o = bbox(out), i = bbox(inn); i.h = Math.max(i.h, o.h * 0.12);   // 다물면 얇은 틈
  switch (look.mouth) {
    case 'slot':   rect(c, o.x0, o.y0, o.w, o.h); rect(c, i.x0, i.cy - i.h / 2, i.w, i.h); break;
    case 'ring':   ellipse(c, o.cx, o.cy, o.w / 2, o.h / 2); ellipse(c, i.cx, i.cy, i.w / 2, i.h / 2); break;
    case 'lips':   loop(c, out); loop(c, inn); break;
    case 'zigzag': rect(c, o.x0, o.y0, o.w, o.h); poly(c, Array.from({ length: 9 }, (_, k) => ({ x: i.x0 + i.w * k / 8, y: i.cy + (k % 2 ? -1 : 1) * i.h / 2 }))); break;
    case 'x':      line(c, { x: o.x0, y: o.y0 }, { x: o.x1, y: o.y1 }); line(c, { x: o.x0, y: o.y1 }, { x: o.x1, y: o.y0 }); line(c, { x: o.x0, y: o.cy }, { x: o.x1, y: o.cy + o.h * 0.1 }); break;
    case 'dots':   inn.forEach((p, k) => { if (k % 2 === 0) circle(c, p.x, p.y, g.w * 0.012, true); }); break;
  }
}

function drawIcon(c, kind, x, y, s) {
  switch (kind) {
    case 'heart':
      c.beginPath(); c.moveTo(x, y + s * 0.9);
      c.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.3);
      c.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); c.stroke(); break;
    case 'crown':
      poly(c, [{ x: x - s, y: y + s * 0.7 }, { x: x - s, y: y - s * 0.6 }, { x: x - s * 0.5, y }, { x, y: y - s }, { x: x + s * 0.5, y }, { x: x + s, y: y - s * 0.6 }, { x: x + s, y: y + s * 0.7 }], true);
      line(c, { x: x - s, y: y + s * 0.35 }, { x: x + s, y: y + s * 0.35 }); break;
    case 'angry':                                     // 💢 모양: 바깥을 향한 꺾쇠 4개
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2, tip = { x: x + Math.cos(a) * s, y: y + Math.sin(a) * s };
        [-0.7, 0.7].forEach(d => line(c, tip, { x: x + Math.cos(a + d) * s * 0.4, y: y + Math.sin(a + d) * s * 0.4 }));
      }
      break;
    case 'bang': {                                    // 느낌표
      const w = s * 0.35;
      poly(c, [{ x: x - w, y: y - s }, { x: x + w, y: y - s }, { x: x + w * 0.4, y: y + s * 0.35 }, { x: x - w * 0.4, y: y + s * 0.35 }], true);
      circle(c, x, y + s * 0.8, w * 0.55); break;
    }
  }
}

function mood() {
  const v = n => bs[n] || 0;
  if ((v('browDownLeft') + v('browDownRight')) / 2 > T.angry) return 'angry';
  if ((v('mouthSmileLeft') + v('mouthSmileRight')) / 2 > T.smile) return 'heart';
  if (v('jawOpen') > T.jawOpen && (v('browInnerUp') > T.browUp || (v('eyeWideLeft') + v('eyeWideRight')) / 2 > T.browUp)) return 'bang';
  return look.neutral;
}

function drawAll(c, kind) {
  const g = geom();
  drawFace(c, g);
  drawBrow(c, look.browR, [70, 63, 105, 66, 107], g.h * 0.04);
  drawBrow(c, look.browL, [336, 296, 334, 293, 300], g.h * 0.04);
  drawEye(c, look.eyeR, mid(P(33), P(133)), dist(P(33), P(133)) * 0.4);
  drawEye(c, look.eyeL, mid(P(362), P(263)), dist(P(362), P(263)) * 0.4);
  drawNose(c, g);
  drawMouth(c, g);
  drawIcon(c, kind, g.top.x, g.top.y - g.h * 0.22, g.w * 0.12);
}

// live=true: 어둡게 깐 영상 위에 흰 선 / live=false: 흰 바탕에 검정 선 + 로고
// crop: 원본 영상에서 잘라낼 정사각형 { S: 한 변, ox, oy: 왼쪽 위 } (완성본용)
function render(c, live, kind, crop = { S: W, ox: 0, oy: 0 }) {
  const cw = c.canvas.width, ch = c.canvas.height, k = cw / crop.S;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#fff'; c.fillRect(0, 0, cw, ch);
  c.translate(cw, 0); c.scale(-1, 1);                 // 거울처럼 좌우 반전
  if (live) { c.drawImage(source, 0, 0, cw, ch); c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(0, 0, cw, ch); }
  c.scale(k, k); c.translate(-crop.ox, -crop.oy);     // 이후 좌표는 원본 영상 픽셀 기준
  c.strokeStyle = c.fillStyle = live ? '#fff' : '#111';
  c.lineWidth = Math.min(W, H) * 0.007; c.lineCap = c.lineJoin = 'round';
  if (lm) drawAll(c, kind);
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (!live) { drawLogo(c); drawTitle(c); }
  if (live && debug) {
    c.fillStyle = '#0f0'; c.font = '14px monospace';
    ['browDownLeft', 'browDownRight', 'mouthSmileLeft', 'mouthSmileRight', 'jawOpen', 'browInnerUp', 'eyeWideLeft', 'eyeWideRight']
      .forEach((n, i) => c.fillText(`${n} ${(bs[n] || 0).toFixed(2)}`, 8, 20 + i * 16));
    c.fillText('→ ' + kind, 8, 20 + 8 * 16);
  }
}

function drawTitle(c) {                              // 좌측 상단
  if (!title.naturalWidth) return;
  const cw = c.canvas.width, m = cw * 0.05, tw = cw * 0.32;
  c.drawImage(title, m, m, tw, tw * title.naturalHeight / title.naturalWidth);
}

function drawLogo(c) {                               // 우측 하단
  const cw = c.canvas.width, ch = c.canvas.height, m = cw * 0.05, lw = cw * 0.28;
  if (logo.naturalWidth) { const lh = lw * logo.naturalHeight / logo.naturalWidth; c.drawImage(logo, cw - m - lw, ch - m - lh, lw, lh); }
  else { c.fillStyle = '#999'; c.font = `${cw * 0.025}px sans-serif`; c.textAlign = 'right'; c.fillText('logo.png 파일을 넣어주세요', cw - m, ch - m); c.textAlign = 'left'; }
}

let first = true;
function frame() {
  if (!running) return;
  if (!imgSrc && video.videoWidth && (video.videoWidth !== W || video.videoHeight !== H)) { W = canvas.width = video.videoWidth; H = canvas.height = video.videoHeight; }
  if (first) { first = false; render(ctx, true, look.neutral); return requestAnimationFrame(frame); }   // 첫 화면은 인식 없이 바로 표시
  const res = imgSrc ? landmarker.detect(source) : landmarker.detectForVideo(source, performance.now());
  lm = res.faceLandmarks[0] || null;
  if (res.faceBlendshapes[0]) for (const b of res.faceBlendshapes[0].categories) bs[b.categoryName] = (bs[b.categoryName] ?? b.score) * 0.7 + b.score * 0.3;
  render(ctx, true, mood());
  if (!$('hint').classList.contains('big')) $('hint').textContent = lm ? '표정을 지어보세요' : '얼굴을 화면에 맞춰주세요';
  requestAnimationFrame(frame);
}

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

async function shoot() {
  if (!lm) return alert('얼굴을 찾지 못했어요. 화면에 얼굴을 맞춰주세요.');
  const h = $('hint'); h.classList.add('big');
  for (let n = 3; n > 0; n--) { h.textContent = n; await new Promise(r => setTimeout(r, 1000)); }
  h.classList.remove('big');
  if (!lm) return alert('얼굴을 찾지 못했어요. 다시 해주세요.');
  running = false;
  const g = geom(), S = Math.min(W, H), clamp = (v, hi) => Math.max(0, Math.min(v, hi));
  const crop = { S, ox: clamp(g.cx - S / 2, W - S), oy: clamp(g.cy - S / 2, H - S) };   // 얼굴 중심 1:1
  const rc = document.createElement('canvas'), k = Math.min(2, 1600 / S);
  rc.width = rc.height = Math.round(S * k);
  render(rc.getContext('2d'), false, mood(), crop);
  $('pic').src = rc.toDataURL('image/png');
  show('gen'); await new Promise(r => setTimeout(r, 2000));   // 생성 중 안내 2초
  show('result');
}

async function openSource() {
  if (imgSrc) {
    const im = new Image(); im.src = imgSrc; await im.decode();
    const k = Math.min(1, 1200 / im.naturalWidth);
    source = document.createElement('canvas');
    source.width = W = Math.round(im.naturalWidth * k); source.height = H = Math.round(im.naturalHeight * k);
    source.getContext('2d').drawImage(im, 0, 0, W, H);
  } else {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false });
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    while (!video.videoWidth) await new Promise(r => setTimeout(r, 50));   // iOS에서 크기가 늦게 잡히는 경우 대기
    source = video; W = video.videoWidth; H = video.videoHeight;
  }
  canvas.width = W; canvas.height = H;
}

$('shuffle').onclick = newLook;
$('shoot').onclick = shoot;
$('again').onclick = () => { wipe(); show('live'); running = true; frame(); };
function wipe() { $('pic').src = ''; lm = null; }   // 완성본과 얼굴 좌표를 즉시 삭제
addEventListener('pagehide', wipe);              // 페이지를 닫거나 벗어나도 삭제
$('save').onclick = () => { const a = document.createElement('a'); a.href = $('pic').src; a.download = `face-${Date.now()}.png`; a.click(); };
$('go').onclick = async () => {
  $('go').disabled = true; $('go').textContent = '카메라 여는 중…';
  try { await openSource(); }
  catch (e) { $('go').disabled = false; $('go').textContent = '시작하기'; return alert('카메라를 열 수 없어요. 브라우저의 카메라 권한을 허용해주세요.\n' + e.message); }
  newLook(); show('live'); running = true; first = true; frame();
};

(async () => {
  const fs = await FilesetResolver.forVisionTasks(WASM);
  const opts = { baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' }, outputFaceBlendshapes: true, runningMode: imgSrc ? 'IMAGE' : 'VIDEO', numFaces: 1 };
  try { landmarker = await FaceLandmarker.createFromOptions(fs, opts); }
  catch { opts.baseOptions.delegate = 'CPU'; landmarker = await FaceLandmarker.createFromOptions(fs, opts); }
  if (!imgSrc) { const warm = document.createElement('canvas'); warm.width = warm.height = 64; landmarker.detectForVideo(warm, performance.now()); }   // 예열
  $('go').disabled = false; $('go').textContent = '시작하기';
})().catch(e => { $('go').textContent = '불러오기 실패: ' + e.message; });
</script>
</body>
</html>
